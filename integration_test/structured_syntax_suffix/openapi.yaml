openapi: 3.1.0
info:
  title: Structured Syntax Suffix API
  description: |-
    Test API verifying that media types using the RFC 6839 structured syntax
    suffix `+json` (e.g. application/vnd.api+json) are treated as JSON and
    decoded into the declared schema instead of being returned as raw bytes.
  version: 1.0.0
servers:
  - url: http://localhost:8080/api/v1
tags:
  - name: widgets
    description: Widget operations
paths:
  /mapped/object:
    post:
      tags: [widgets]
      operationId: postMappedObject
      requestBody:
        required: true
        content:
          application/x-amz-json-1.1:
            schema:
              $ref: '#/components/schemas/JsonPayload'
      responses:
        '204':
          description: Body received
  /mapped/list:
    post:
      tags: [widgets]
      operationId: postMappedList
      requestBody:
        required: true
        content:
          application/x-amz-json-1.1:
            schema:
              type: array
              items:
                type: string
      responses:
        '204':
          description: Body received
  /mapped/string:
    post:
      tags: [widgets]
      operationId: postMappedString
      requestBody:
        required: true
        content:
          application/x-amz-json-1.1:
            schema:
              type: string
      responses:
        '204':
          description: Body received
  /mapped/optional:
    post:
      tags: [widgets]
      operationId: postMappedOptional
      requestBody:
        content:
          application/x-amz-json-1.1:
            schema:
              $ref: '#/components/schemas/NullableJsonPayload'
      responses:
        '204':
          description: Body received
  /mapped/nullable:
    post:
      tags: [widgets]
      operationId: postMappedNullable
      requestBody:
        required: true
        content:
          application/x-amz-json-1.1:
            schema:
              $ref: '#/components/schemas/NullableJsonPayload'
      responses:
        '204':
          description: Body received
  /mapped/choice:
    post:
      tags: [widgets]
      operationId: postMappedChoice
      requestBody:
        $ref: '#/components/requestBodies/JsonChoice'
      responses:
        '204':
          description: Body received
  /mapped/number:
    post:
      tags: [widgets]
      operationId: postMappedNumber
      requestBody:
        required: true
        content:
          application/x-amz-json-1.1:
            schema:
              type: number
      responses:
        '204':
          description: Body received
  /standard/object:
    post:
      tags: [widgets]
      operationId: postStandardObject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JsonPayload'
      responses:
        '204':
          description: Body received
  /json/charset:
    get:
      tags: [widgets]
      operationId: getJsonCharset
      responses:
        '200':
          description: JSON with a charset-qualified declaration
          content:
            application/json; charset=utf-8:
              schema:
                type: string
  /json/charset-profile:
    get:
      tags: [widgets]
      operationId: getJsonCharsetProfile
      responses:
        '200':
          description: JSON with charset and a required profile
          content:
            'Application/JSON; CHARSET=UTF-8; profile="Full"':
              schema:
                type: string
  /json/charset-variants:
    get:
      tags: [widgets]
      operationId: getJsonCharsetVariants
      responses:
        '200':
          description: Meaningful parameters take precedence over charset
          content:
            application/json; charset=utf-8:
              schema:
                type: integer
            application/json; version=2:
              schema:
                type: string
  /text/charset:
    get:
      tags: [widgets]
      operationId: getTextCharset
      responses:
        '200':
          description: Text alternatives with distinct charsets
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
            text/plain; charset=latin1:
              schema:
                type: string
  /text/charset-reversed:
    get:
      tags: [widgets]
      operationId: getTextCharsetReversed
      responses:
        '200':
          description: Latin-1 is the first declared text alternative
          content:
            text/plain; charset=latin1:
              schema:
                type: string
            text/plain; charset=utf-8:
              schema:
                type: string
  /json/latin1:
    get:
      tags: [widgets]
      operationId: getJsonLatin1
      responses:
        '200':
          description: JSON with an explicit Latin-1 charset
          content:
            application/json; charset=latin1:
              schema:
                type: string
  /form/charset:
    get:
      tags: [widgets]
      operationId: getFormCharset
      responses:
        '200':
          description: Form text with an explicit Latin-1 charset
          content:
            application/x-www-form-urlencoded; charset=latin1:
              schema:
                type: object
                required: [name]
                properties:
                  name:
                    type: string
  /problem/charset:
    get:
      tags: [widgets]
      operationId: getProblemCharset
      responses:
        '200':
          description: Structured JSON suffix with a declared charset
          content:
            application/problem+json; charset=latin1:
              schema:
                type: string
  /document:
    get:
      tags: [widgets]
      operationId: getDocument
      responses:
        '200':
          description: Document representations selected by media parameters
          content:
            application/vnd.example.document+json:
              schema:
                type: integer
            application/vnd.example.document+json;version=2:
              schema:
                type: string
            'application/vnd.example.document+json;version=2;profile="Full;V2"':
              schema:
                type: boolean
  /document/reversed:
    get:
      tags: [widgets]
      operationId: getDocumentReversed
      responses:
        '200':
          description: Parameterized representation declared first
          content:
            application/vnd.example.document+json;version=2:
              schema:
                type: string
            application/vnd.example.document+json:
              schema:
                type: integer
  /widget:
    get:
      tags:
        - widgets
      summary: Get a widget
      description: Returns a widget using the application/vnd.api+json media type.
      operationId: getWidget
      responses:
        '200':
          description: Widget retrieved successfully
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/Widget'
  /problem:
    get:
      tags:
        - widgets
      summary: Get a problem document
      description: Returns a widget using the application/problem+json media type.
      operationId: getProblem
      responses:
        '200':
          description: Problem document retrieved successfully
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Widget'
  /wildcard/application:
    get:
      tags:
        - widgets
      summary: Get bytes through an application media-type range
      description: |-
        Returns application/json while the response is declared as
        application/*, so the client should match the range and deliver raw
        bytes.
      operationId: getApplicationWildcard
      responses:
        '200':
          description: Wildcard application response retrieved successfully
          content:
            'application/*':
              schema:
                $ref: '#/components/schemas/Widget'
  /wildcard/catch-all:
    get:
      tags:
        - widgets
      summary: Get bytes through the catch-all media-type range
      description: |-
        Returns text/plain while the response is declared as */*, so the client
        should match the range and deliver raw bytes.
      operationId: getCatchAllWildcard
      responses:
        '200':
          description: Catch-all wildcard response retrieved successfully
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Widget'
components:
  requestBodies:
    JsonChoice:
      content:
        application/x-amz-json-1.1:
          schema:
            $ref: '#/components/schemas/NullableJsonPayload'
        text/plain:
          schema:
            type: string
  schemas:
    JsonPayload:
      type: object
      additionalProperties: false
      required: [name, count]
      properties:
        name:
          type: string
        count:
          type: integer
    NullableJsonPayload:
      type: [object, 'null']
      additionalProperties: false
      required: [name, count]
      properties:
        name:
          type: string
        count:
          type: integer
    Widget:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
        name:
          type: string
