openapi: 3.1.0
info:
  title: Composition API
  description: OpenAPI specification showcasing composition of models
  version: 1.0.0
  contact:
    name: Example
    url: https://example.com
    email: example@example.com

servers:
  - url: https://api.example.com/v1

tags:
  - name: composition
    description: Operations demonstrating composition of models

paths:
  x-generated-by: fixture
  /no-declared-responses:
    post:
      operationId: noDeclaredResponses
      tags:
        - composition

  /health:
    get:
      operationId: health
      tags:
        - composition
      summary: Health check
      description: Health check endpoint
      responses:
        x-note: Health response metadata
        '2XX':
          description: Successful response

  /shapes:
    get:
      operationId: getShapes
      tags:
        - composition
      summary: Get shapes (discriminated polymorphism)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shape'

  /one-of-primitive/echo:
    post:
      operationId: echoOneOfPrimitive
      tags:
        - composition
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OneOfPrimitive'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OneOfPrimitive'

  /one-of-integer-or-number/echo:
    post:
      operationId: echoOneOfIntegerOrNumber
      tags:
        - composition
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OneOfIntegerOrNumber'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OneOfIntegerOrNumber'

  /one-of-integer-or-object/echo:
    post:
      operationId: echoOneOfIntegerOrClass1
      tags:
        - composition
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OneOfIntegerOrClass1'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OneOfIntegerOrClass1'

  /one-of-scalar-mix/echo:
    post:
      operationId: echoOneOfScalarMix
      tags:
        - composition
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OneOfScalarMix'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OneOfScalarMix'

  /one-of-date-time-or-string/echo:
    post:
      operationId: echoOneOfDateTimeOrString
      tags:
        - composition
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OneOfDateTimeOrString'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OneOfDateTimeOrString'

  /any-of-date-time-or-string/echo:
    post:
      operationId: echoAnyOfDateTimeOrString
      tags:
        - composition
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnyOfDateTimeOrString'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnyOfDateTimeOrString'

  /one-of-base64-or-string/echo:
    post:
      operationId: echoOneOfBase64OrString
      tags:
        - composition
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OneOfBase64OrString'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OneOfBase64OrString'

  /standalone-null/echo:
    get:
      operationId: getStandaloneNull
      tags:
        - composition
      responses:
        '200':
          description: OK
          headers:
            X-Null-Header:
              schema:
                $ref: '#/components/schemas/NullType'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NullType'

components:
  schemas:
    Class1:
      type: object
      required:
        - name
      properties:
        name:
          type: string

    Class2:
      type: object
      required:
        - number
      properties:
        number:
          type: integer

    Enum1:
      type: string
      enum:
        - value1
        - value2

    Enum2:
      type: integer
      enum:
        - 1
        - 2

    OneOfPrimitive:
      oneOf:
        - type: string
        - type: integer

    OneOfIntegerOrClass1:
      oneOf:
        - type: integer
        - $ref: '#/components/schemas/Class1'

    OneOfIntegerOrNumber:
      oneOf:
        - type: integer
        - type: number

    OneOfScalarMix:
      oneOf:
        - type: integer
        - type: number
          format: double
        - type: string
          format: decimal
        - type: string

    OneOfDateTimeOrString:
      oneOf:
        - type: string
          format: date-time
        - type: string

    OneOfBase64OrString:
      oneOf:
        - type: string
          format: byte
        - type: string

    AnyOfDateTimeOrString:
      anyOf:
        - type: string
          format: date-time
        - type: string

    OneOfComplex:
      oneOf:
        - $ref: '#/components/schemas/Class1'
        - $ref: '#/components/schemas/Class2'

    OneOfEnum:
      oneOf:
        - $ref: '#/components/schemas/Enum1'
        - $ref: '#/components/schemas/Enum2'

    EmptyOneOf:
      oneOf: []

    AllOfPrimitive:
      allOf:
        - type: object
          properties:
            id:
              type: string
        - type: object
          properties:
            count:
              type: integer

    AllOfComplex: 
      allOf:
        - $ref: '#/components/schemas/Class1'
        - $ref: '#/components/schemas/Class2'

    AllOfEnum: 
      allOf:
        - type: object
          properties:
            status:
              $ref: '#/components/schemas/Enum1'
        - type: object
          properties:
            priority:
              $ref: '#/components/schemas/Enum2'

    AnyOfPrimitive:
      anyOf:
        - type: string
        - type: integer
        - type: boolean

    AnyOfComplex:
      anyOf:
        - $ref: '#/components/schemas/Class1'
        - $ref: '#/components/schemas/Class2'

    AnyOfEnum:
      anyOf:
        - $ref: '#/components/schemas/Enum1'
        - $ref: '#/components/schemas/Enum2'

    OneOfMixed: 
      oneOf:
        - type: string
        - $ref: '#/components/schemas/Class1'
        - $ref: '#/components/schemas/Enum1'

    AllOfMixed: 
      allOf:
        - type: string
        - $ref: '#/components/schemas/Class1'

    AnyOfMixed:
      anyOf:
        - type: integer
        - $ref: '#/components/schemas/Class2'
        - $ref: '#/components/schemas/Enum2'

    NestedOneOfInOneOf: 
      oneOf:
        - $ref: '#/components/schemas/OneOfPrimitive'
        - $ref: '#/components/schemas/OneOfComplex'

    NestedAllOfInAllOf: 
      allOf:
        - $ref: '#/components/schemas/AllOfComplex'
        - type: object
          properties:
            extra:
              type: string

    NestedAnyOfInAnyOf:
      anyOf:
        - $ref: '#/components/schemas/AnyOfPrimitive'
        - $ref: '#/components/schemas/AnyOfComplex'

    NestedOneOfInAllOf: 
      allOf:
        - $ref: '#/components/schemas/OneOfPrimitive'
        - type: object
          properties:
            metadata:
              type: string

    NestedAllOfInOneOf: 
      oneOf:
        - $ref: '#/components/schemas/AllOfComplex'
        - type: string

    NestedAnyOfInOneOf: 
      oneOf:
        - $ref: '#/components/schemas/AnyOfMixed'
        - type: boolean

    NestedOneOfInAnyOf:
      anyOf:
        - $ref: '#/components/schemas/OneOfEnum'
        - type: number

    NestedAllOfInAnyOf:
      anyOf:
        - $ref: '#/components/schemas/AllOfMixed'
        - $ref: '#/components/schemas/Class1'

    NestedAnyOfInAllOf:
      allOf:
        - $ref: '#/components/schemas/AnyOfComplex'
        - type: object
          properties:
            timestamp:
              type: integer

    DeepNestedOneOf: 
      oneOf:
        - $ref: '#/components/schemas/NestedOneOfInOneOf'
        - $ref: '#/components/schemas/Class1'

    DeepNestedAllOf:
      allOf:
        - $ref: '#/components/schemas/NestedAllOfInAllOf'
        - type: object
          properties:
            deep:
              type: boolean

    DeepNestedAnyOf:
      anyOf:
        - $ref: '#/components/schemas/NestedAnyOfInAnyOf'
        - $ref: '#/components/schemas/Enum1'

    TwoLevelOneOf: 
      oneOf:
        - oneOf:
            - type: string
            - type: integer
        - type: boolean

    TwoLevelAllOf: 
      allOf:
        - allOf:
            - type: object
              properties:
                id:
                  type: string
            - type: object
              properties:
                name:
                  type: string
        - type: object
          properties:
            active:
              type: boolean

    TwoLevelAnyOf:
      anyOf:
        - anyOf:
            - $ref: '#/components/schemas/Class1'
            - $ref: '#/components/schemas/Class2'
        - type: string

    TwoLevelMixedOneOfAllOf: #done
      oneOf:
        - allOf:
            - $ref: '#/components/schemas/Class1'
            - type: object
              properties:
                timestamp:
                  type: integer
        - type: string

    TwoLevelMixedAllOfAnyOf: #done
      allOf:
        - anyOf:
            - type: string
            - type: integer
        - type: object
          properties:
            metadata:
              type: string

    TwoLevelMixedAnyOfOneOf:
      anyOf:
        - oneOf:
            - $ref: '#/components/schemas/Enum1'
            - $ref: '#/components/schemas/Enum2'
        - $ref: '#/components/schemas/Class1'

    ThreeLevelOneOf: #done
      oneOf:
        - oneOf:
            - oneOf:
                - type: string
                - type: integer
            - type: boolean
        - type: number

    ThreeLevelAllOf:
      allOf:
        - allOf:
            - allOf:
                - type: object
                  properties:
                    id:
                      type: string
                - type: object
                  properties:
                    name:
                      type: string
            - type: object
              properties:
                email:
                  type: string
        - type: object
          properties:
            verified:
              type: boolean

    ThreeLevelAnyOf:
      anyOf:
        - anyOf:
            - anyOf:
                - $ref: '#/components/schemas/Class1'
                - $ref: '#/components/schemas/Class2'
            - $ref: '#/components/schemas/Enum1'
        - type: string

    ThreeLevelMixedOneOfAllOfAnyOf: 
      oneOf:
        - allOf:
            - anyOf:
                - type: string
                - type: integer
            - type: object
              properties:
                flag:
                  type: boolean
        - $ref: '#/components/schemas/Class1'

    ThreeLevelMixedAllOfOneOfAnyOf: 
      allOf:
        - oneOf:
            - anyOf:
                - $ref: '#/components/schemas/Enum1'
                - $ref: '#/components/schemas/Class1'
            - type: string
        - type: object
          properties:
            metadata:
              type: string

    ThreeLevelMixedAnyOfAllOfOneOf:
      anyOf:
        - allOf:
            - oneOf:
                - $ref: '#/components/schemas/Class1'
                - $ref: '#/components/schemas/Class2'
            - type: object
              properties:
                extra:
                  type: integer
        - type: boolean

    ThreeLevelWithRefs:
      oneOf:
        - $ref: '#/components/schemas/TwoLevelOneOf'
        - $ref: '#/components/schemas/TwoLevelAllOf'
        - type: string

    ThreeLevelMixedRefs:
      allOf:
        - $ref: '#/components/schemas/TwoLevelMixedAllOfAnyOf'
        - anyOf:
            - $ref: '#/components/schemas/Class1'
            - type: integer

    ComplexNestedMix:
      allOf:
        - type: object
          properties:
            base:
              type: string
        - oneOf:
            - $ref: '#/components/schemas/Class1'
            - $ref: '#/components/schemas/Class2'

    ComplexNestedMix2:
      oneOf:
        - allOf:
            - $ref: '#/components/schemas/Class1'
            - type: object
              properties:
                extra:
                  type: integer
        - $ref: '#/components/schemas/Enum1'

    ComplexNestedMix3:
      anyOf:
        - oneOf:
            - type: string
            - type: integer
        - allOf:
            - $ref: '#/components/schemas/Class2'
            - type: object
              properties:
                flag:
                  type: boolean

    MultiLevelNesting:
      allOf:
        - type: object
          properties:
            level1:
              oneOf:
                - type: string
                - anyOf:
                    - $ref: '#/components/schemas/Class1'
                    - $ref: '#/components/schemas/Class2'
        - type: object
          properties:
            level2:
              type: integer

    AllOfWithSimpleList:
      allOf:
        - type: object
          properties:
            tags:
              type: array
              items:
                type: string
        - type: object
          properties:
            ids:
              type: array
              items:
                type: integer

    AllOfWithComplexList:
      allOf:
        - type: object
          properties:
            users:
              type: array
              items:
                $ref: '#/components/schemas/Class1'
        - type: object
          properties:
            metadata:
              type: string

    AllOfWithMixedLists:
      allOf:
        - type: object
          properties:
            tags:
              type: array
              items:
                type: string
        - type: object
          properties:
            users:
              type: array
              items:
                $ref: '#/components/schemas/Class1'

    AnyOfWithSimpleList:
      anyOf:
        - type: array
          items:
            type: string
        - type: array
          items:
            type: integer
        - type: string

    AnyOfWithComplexList:
      anyOf:
        - type: array
          items:
            $ref: '#/components/schemas/Class1'
        - type: array
          items:
            $ref: '#/components/schemas/Class2'
        - type: string

    AnyOfWithMixedLists:
      anyOf:
        - type: array
          items:
            type: integer
        - type: array
          items:
            $ref: '#/components/schemas/Class1'
        - type: boolean

    AllOfWithEnumList:
      allOf:
        - type: object
          properties:
            statuses:
              type: array
              items:
                $ref: '#/components/schemas/Enum1'
        - type: object
          properties:
            priorities:
              type: array
              items:
                $ref: '#/components/schemas/Enum2'

    AnyOfWithEnumList:
      anyOf:
        - type: array
          items:
            $ref: '#/components/schemas/Enum1'
        - type: array
          items:
            $ref: '#/components/schemas/Enum2'
        - type: string

    NestedListInAllOf:
      allOf:
        - type: object
          properties:
            matrix:
              type: array
              items:
                type: array
                items:
                  type: integer
        - type: object
          properties:
            name:
              type: string

    NestedListInAnyOf:
      anyOf:
        - type: array
          items:
            type: array
            items:
              type: string
        - type: string

    ComplexListComposition:
      allOf:
        - type: object
          properties:
            simpleList:
              type: array
              items:
                type: string
        - anyOf:
            - type: object
              required:
                - enumList
              properties:
                enumList:
                  type: array
                  items:
                    $ref: '#/components/schemas/Enum1'
            - type: object
              required:
                - complexList
              properties:
                complexList:
                  type: array
                  items:
                    $ref: '#/components/schemas/Class1'

    AllOfWithListOfComposites:
      allOf:
        - type: object
          properties:
            items:
              type: array
              items:
                oneOf:
                  - $ref: '#/components/schemas/Class1'
                  - $ref: '#/components/schemas/Class2'
        - type: object
          properties:
            count:
              type: integer

    AnyOfWithListOfComposites:
      anyOf:
        - type: array
          items:
            allOf:
              - $ref: '#/components/schemas/Class1'
              - type: object
                properties:
                  extra:
                    type: string
        - type: string

    AllOfDoubleList:
      allOf:
        - type: array
          items:
            type: string
        - type: array
          items:
            type: string
            format: date-time

    AllOfOneOfDoubleList:
      allOf:
      - type: array
        items:
          oneOf:
            - type: string
            - type: integer
      - type: array
        items:
          type: string
          format: date-time

    AllOfDirectPrimitive:
      allOf:
        - type: integer
        - type: number

    Counter:
      type: object
      required: [count]
      properties:
        count:
          type: integer

    Gauge:
      type: object
      required: [level]
      properties:
        level:
          type: integer

    Flag:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean

    TaggedMetric:
      type: object
      required: [count, type]
      properties:
        count:
          type: integer
        type:
          type: [string, 'null']

    Metric:
      oneOf:
        - $ref: '#/components/schemas/Counter'
        - $ref: '#/components/schemas/Gauge'
        - $ref: '#/components/schemas/Flag'
        - $ref: '#/components/schemas/TaggedMetric'
      discriminator:
        propertyName: type
        mapping:
          counter: '#/components/schemas/Counter'
          gauge: '#/components/schemas/Gauge'
          flag: '#/components/schemas/Flag'
          tagged: '#/components/schemas/TaggedMetric'

    # ==================================================================
    # Discriminator inheritance via allOf
    # ==================================================================
    # These schemas test the pattern where a parent object has a discriminator,
    # child schemas inherit from the parent via allOf, and a oneOf/anyOf
    # references the children. The oneOf/anyOf should inherit the discriminator.

    # Parent schema with discriminator
    Pet:
      type: object
      required:
        - name
        - petType
      properties:
        name:
          type: string
        petType:
          type: string
      discriminator:
        propertyName: petType
        mapping:
          cat: '#/components/schemas/Cat'
          dog: '#/components/schemas/Dog'

    # Child that inherits from Pet via allOf
    Cat:
      allOf:
        - $ref: '#/components/schemas/Pet'
        - type: object
          properties:
            meow:
              type: string
              description: The sound a cat makes

    # Another child that inherits from Pet via allOf
    Dog:
      allOf:
        - $ref: '#/components/schemas/Pet'
        - type: object
          properties:
            bark:
              type: string
              description: The sound a dog makes

    # oneOf that should inherit discriminator from Pet
    # No direct discriminator here - it should be inherited
    PetChoice:
      oneOf:
        - $ref: '#/components/schemas/Cat'
        - $ref: '#/components/schemas/Dog'

    # anyOf that should inherit discriminator from Pet
    PetAnyChoice:
      anyOf:
        - $ref: '#/components/schemas/Cat'
        - $ref: '#/components/schemas/Dog'

    # Parent without explicit mapping (discriminator values should be inferred)
    Vehicle:
      type: object
      required:
        - brand
        - vehicleType
      properties:
        brand:
          type: string
        vehicleType:
          type: string
      discriminator:
        propertyName: vehicleType

    # Children without explicit mapping in parent
    Bike:
      allOf:
        - $ref: '#/components/schemas/Vehicle'
        - type: object
          properties:
            gears:
              type: integer

    Truck:
      allOf:
        - $ref: '#/components/schemas/Vehicle'
        - type: object
          properties:
            capacity:
              type: integer

    # oneOf with inferred discriminator values
    VehicleChoice:
      oneOf:
        - $ref: '#/components/schemas/Bike'
        - $ref: '#/components/schemas/Truck'

    Shape:
      oneOf:
        - $ref: '#/components/schemas/Circle'
        - $ref: '#/components/schemas/Rectangle'
      discriminator:
        propertyName: type

    Circle:
      allOf:
        - $ref: '#/components/schemas/Shape'
        - type: object
          required:
            - type
            - radius
          properties:
            type:
              type: string
            radius:
              type: number

    Rectangle:
      allOf:
        - $ref: '#/components/schemas/Shape'
        - type: object
          required:
            - type
            - width
            - height
          properties:
            type:
              type: string
            width:
              type: number
            height:
              type: number

    NodeA:
      allOf:
        - $ref: '#/components/schemas/NodeB'
        - type: object
          required:
            - aField
          properties:
            aField:
              type: string

    NodeB:
      allOf:
        - $ref: '#/components/schemas/NodeA'
        - type: object
          required:
            - bField
          properties:
            bField:
              type: integer

    # ==================================================================
    # Boolean schema (true) in oneOf — OpenAPI 3.1 / JSON Schema 2020-12
    # ==================================================================
    # The boolean `true` schema means "accept any value". The parser converts
    # it to an AnyModel. This exercises the generator's handling of AnyModel
    # as a oneOf variant.
    OneOfBooleanSchema:
      oneOf:
        - true
        - $ref: '#/components/schemas/Class1'

    # ==================================================================
    # Base64 (format: byte) variant in oneOf and anyOf
    # ==================================================================
    # `type: string, format: byte` is parsed as Base64Model and represented as
    # TonikFile at the API surface. Encoding to simple/form/label parameter
    # styles must convert the file via toBase64String() before delegating to
    # the String encoders, mirroring the precedent in plain Base64 encoders.
    OneOfBase64Variant:
      oneOf:
        - $ref: '#/components/schemas/Class1'
        - type: string
          format: byte

    AnyOfBase64Variant:
      anyOf:
        - $ref: '#/components/schemas/Class1'
        - type: string
          format: byte

    # Boolean true → AnyModel variant (OpenAPI 3.1 / JSON Schema 2020-12).
    AnyOfBooleanSchema:
      anyOf:
        - true
        - $ref: '#/components/schemas/Class1'

    NullType:
      type: "null"

    OneOfWithNull:
      oneOf:
        - $ref: '#/components/schemas/Class1'
        - type: "null"

    OneOfWithNullRef:
      oneOf:
        - $ref: '#/components/schemas/Class1'
        - $ref: '#/components/schemas/NullType'

    AnyOfWithNull:
      anyOf:
        - $ref: '#/components/schemas/Class1'
        - type: "null"

    NullMemberHolder:
      type: object
      required:
        - oneOfValue
        - oneOfRefValue
        - anyOfValue
      properties:
        oneOfValue:
          $ref: '#/components/schemas/OneOfWithNull'
        oneOfRefValue:
          $ref: '#/components/schemas/OneOfWithNullRef'
        anyOfValue:
          $ref: '#/components/schemas/AnyOfWithNull'

    EmptyIntersection:
      allOf: [{}, {}]

    IntegerEmptyIntersection:
      allOf:
        - type: integer
        - {}

    OpenEmptyIntersection:
      allOf: [{}]
      additionalProperties: true

    StringPropertiesIntersection:
      allOf: [{}]
      additionalProperties:
        type: string

    ClosedEmptyIntersection:
      allOf: [{}]
      additionalProperties: false

    RecursiveEmptyIntersection:
      allOf: [{}]
      additionalProperties:
        $ref: '#/components/schemas/RecursiveEmptyIntersection'

    UnconstrainedAllOfHolder:
      type: object
      required: [any, open, strings, closed]
      properties:
        any:
          $ref: '#/components/schemas/EmptyIntersection'
        open:
          $ref: '#/components/schemas/OpenEmptyIntersection'
        strings:
          $ref: '#/components/schemas/StringPropertiesIntersection'
        closed:
          $ref: '#/components/schemas/ClosedEmptyIntersection'

    StandaloneNullHolder:
      type: object
      required:
        - viaRef
        - inline
        - nullList
        - nullMap
      properties:
        viaRef:
          $ref: '#/components/schemas/NullType'
        inline:
          type: "null"
        nullList:
          type: array
          items:
            type: "null"
        nullMap:
          type: object
          additionalProperties:
            type: "null"

    AliasedSquare:
      type: object
      required: [shapeType, side]
      properties:
        shapeType:
          type: string
          enum: [square, box, AliasedCircle]
        side:
