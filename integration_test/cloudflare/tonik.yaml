spec: cloudflare/openapi.json
packageName: cloudflare_api
outputDir: cloudflare

filter:
  excludeOperations:
    # The request body is an open-ended multipart map. Multipart roots require
    # statically declared part names so this operation is intentionally omitted.
    - worker-assets-upload
    # This request body declares a metadata part plus file-valued dynamic parts.
    # Dynamic multipart part names are intentionally unsupported for now.
    - updateZoneSnippet
