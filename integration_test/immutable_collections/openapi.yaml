openapi: 3.0.4
info:
  title: Immutable Collections Test API
  description: >-
    OpenAPI specification for testing immutableCollections: true code generation.
    Covers list properties, map properties, nested collections, and composition.
  version: 1.0.0
  contact:
    name: Example
    url: https://example.com
    email: example@example.com

servers:
  - url: http://localhost:8080

tags:
  - name: items
    description: Operations for items with collection fields

paths:
  /packed-merged:
    post:
      operationId: postPackedMerged
      tags: [items]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PackedMerged'
            encoding:
              values:
                contentType: application/json
      responses:
        '204':
          description: Accepted
  /json-nullable-list:
    post:
      operationId: postJsonNullableList
      tags: [items]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              nullable: true
              items:
                type: integer
      responses:
        '204':
          description: Accepted
  /json-nullable-list-variant:
    post:
      operationId: postJsonNullableListVariant
      tags: [items]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              nullable: true
              items:
                type: integer
          text/plain:
            schema:
              type: string
      responses:
        '204':
          description: Accepted
  /json-inline-map:
    post:
      operationId: postJsonInlineMap
      tags: [items]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties:
                type: string
      responses:
        '204':
          description: Accepted
  /json-inline-nested:
    post:
      operationId: postJsonInlineNested
      tags: [items]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                additionalProperties:
                  type: array
                  items:
                    type: integer
          text/plain:
            schema:
              type: string
      responses:
        '204':
          description: Accepted
  /dynamic-headers:
    post:
      operationId: postDynamicHeaders
      tags: [items]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DynamicMixed'
            encoding:
              label:
                headers:
                  X-Tags:
                    required: true
                    schema:
                      type: array
                      items:
                        type: string
      responses:
        '204':
          description: Accepted
  /dynamic-headers-multi:
    post:
      operationId: postDynamicHeadersMulti
      tags: [items]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DynamicMixed'
            encoding:
              label:
                headers:
                  X-Tags:
                    required: true
                    schema:
                      type: array
                      items:
                        type: string
          application/json:
            schema:
              $ref: '#/components/schemas/DynamicMixed'
      responses:
        '204':
          description: Accepted
  /dynamic-inline-map:
    post:
      operationId: postDynamicInlineMap
      tags: [items]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties:
                type: string
      responses:
        '204':
          description: Accepted
  /dynamic-map:
    post:
      operationId: postDynamicMap
      tags: [items]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DynamicMap'
      responses:
        '204':
          description: Accepted
  /dynamic-mixed:
    post:
      operationId: postDynamicMixed
      tags: [items]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DynamicMixed'
      responses:
        '204':
          description: Accepted
  /items/{id}:
    get:
      operationId: getItem
      tags:
        - items
      summary: Get a single item by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: A single item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
              example:
                id: 1
                name: Widget
                tags:
                  - cool
                  - useful
                children:
                  - childName: bolt
                    value: 10
                metadata:
                  color: red
                  size: large
        '404':
          description: Item not found

  /items:
    post:
      operationId: createItem
      tags:
        - items
      summary: Create a new item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Item'
      responses:
        '201':
          description: Created item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
              example:
                id: 1
                name: Widget
                tags:
                  - cool
                  - useful
                children:
                  - childName: bolt
                    value: 10
                metadata:
                  color: red
                  size: large

  /string-list:
    get:
      operationId: listStrings
      tags:
        - items
      summary: Get a list of strings directly
      responses:
        '200':
          description: A list of strings
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
              example:
                - alpha
                - bravo
                - charlie

  /counts:
    get:
      operationId: getCounts
      tags:
        - items
      summary: Get a map of string to int directly
      responses:
        '200':
          description: A map of counts
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: integer
              example:
                apples: 3
                bananas: 5

  /nested:
    post:
      operationId: createNested
      tags:
        - items
      summary: Create a nested list structure
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NestedList'
      responses:
        '200':
          description: Echo nested list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NestedList'
              example:
                matrix:
                  - - a
                    - b
                  - - c
                    - d

  /tagged-item:
    get:
      operationId: getTaggedItem
      tags:
        - items
      summary: Get a tagged item (class with properties + typed AP with list values)
      responses:
        '200':
          description: A tagged item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaggedItem'

  /extended-item:
    get:
      operationId: getExtendedItem
      tags:
        - items
      summary: Get an extended item (allOf with typed additionalProperties list values)
      responses:
        '200':
          description: An extended item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtendedItem'
              example:
                id: abc-123
                name: Widget
                customTags:
                  - cool
                  - useful

  /combined:
    get:
      operationId: getCombined
      tags:
        - items
      summary: Get a combined allOf with MapModel component
      responses:
        '200':
          description: A combined object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Combined'
              example:
                name: test
                extra1: value1
                extra2: value2

  /response/nullable-never-array:
    get:
      operationId: getResponseNullableNeverArray
      tags:
        - items
      summary: >-
        Nullable array of never items under immutableCollections.
        Code-generation-only regression check — the JSON list decoder must
        emit a `value == null ? null : throw ...` shape rather than a bare
        throw, so the generated client analyzes cleanly.
      responses:
        '200':
          description: Nullable never-item array body
          content:
            application/json:
              schema:
                type: array
                nullable: true
                items: false

  /streamed-tag-groups:
    get:
      operationId: getStreamedTagGroups
      tags: [items]
      responses:
        '200':
          description: Immutable nested collection items
          content:
            application/x-ndjson:
              itemSchema:
                type: array
                items:
                  $ref: '#/components/schemas/TagGroups'

components:
  schemas:
    # Simple list property + map property + list of objects
    Item:
      type: object
      required:
        - id
        - name
        - tags
        - children
        - metadata
      properties:
        id:
          type: integer
        name:
          type: string
        tags:
          type: array
          items:
            type: string
        children:
          type: array
          items:
            $ref: '#/components/schemas/ChildModel'
        metadata:
          type: object
          additionalProperties:
            type: string

    # Child model used in list of objects
    ChildModel:
      type: object
      required:
        - childName
        - value
      properties:
        childName:
          type: string
        value:
          type: integer

    # Simple map with string values (pure map typedef)
    StringMetadata:
      type: object
      additionalProperties:
        type: string

    # Map with list values
    TagGroups:
      type: object
      additionalProperties:
        type: array
        items:
          type: string

    # Optional list field — tests nullable IList deserialization/encoding
    ItemSummary:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
        name:
          type: string
        categories:
          type: array
          items:
            type: string

    # Optional map field — tests nullable IMap
    Config:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        settings:
          type: object
          additionalProperties:
            type: string

    # Mix of required and optional collection fields
    MixedItem:
      type: object
      required:
        - requiredTags
      properties:
        requiredTags:
          type: array
          items:
            type: string
        optionalTags:
          type: array
          items:
            type: string
        requiredMeta:
          type: object
          additionalProperties:
            type: integer
        optionalMeta:
          type: object
          additionalProperties:
            type: integer

    # Nested list (list of list of strings)
    NestedList:
      type: object
      required:
        - matrix
      properties:
        matrix:
          type: array
          items:
            type: array
            items:
              type: string

    # Class with properties + typed additionalProperties (list values)
    # Tests that fromJson scratch map uses IList<String> as value type
    TaggedItem:
      type: object
      properties:
        name:
          type: string
      additionalProperties:
        type: array
        items:
          type: string

    # Pure map typedef (additionalProperties-only) for allOf composition test
    ExtraData:
      type: object
      additionalProperties:
        type: string

    # Base schema for allOf composition test with typed additionalProperties
    BaseItem:
      type: object
      properties:
        id:
          type: string

    # allOf with typed additionalProperties (list values) at the allOf level
    # Tests that fromJson scratch map in allOf generator uses IList<String>
    ExtendedItem:
      allOf:
        - $ref: '#/components/schemas/BaseItem'
        - type: object
          properties:
            name:
              type: string
      additionalProperties:
        type: array
        items:
          type: string

    # allOf combining a MapModel component with a ClassModel — tests
    # that fast_immutable_collections import is emitted for IMap constructor usage
    Combined:
      allOf:
        - $ref: '#/components/schemas/ExtraData'
        - type: object
          properties:
            name:
              type: string

    # Const collection / AnyModel defaults under immutableCollections — the
    # generated Filters class must wrap the list/map defaults in
    # IListConst / IMapConst so they retain const-identity across instances.
    Filters:
      type: object
      properties:
        tags:
          type: array
          items:
            type: string
          default: ["new", "featured"]
        counts:
          type: object
          additionalProperties:
            type: integer
          default:
            x: 1
            y: 2
        raw:
          type: object
          additionalProperties: true
          default:
            any: "value"
            nested: [1, 2, 3]

    BucketWithExtras:
      type: object
      properties:
        label:
          type: string
      additionalProperties:
        type: integer

    BucketHolder:
      type: object
      properties:
        bucket:
          $ref: '#/components/schemas/BucketWithExtras'
          default:
            label: "primary"
            x: 1
            y: 2


    DynamicMap:
      type: object
      additionalProperties:
        type: array
        items:
          type: integer
    DynamicMixed:
      type: object
      required: [label]
      properties:
        label:
          type: string
      additionalProperties:
        type: object
        additionalProperties:
          type: array
          items:
            type: integer

    PackedFirst:
      type: object
      required: [values]
      properties:
        values:
          type: array
          items:
            type: string
            format: uri
            nullable: true
    PackedSecond:
      type: object
      required: [values]
      properties:
        values:
          type: array
          items:
            type: string
            format: uri
            nullable: true
    PackedMerged:
      allOf:
        - $ref: '#/components/schemas/PackedFirst'
        - $ref: '#/components/schemas/PackedSecond'
